baseURL = 'http://localhost:1313/'
locale = 'zh-tw'
title = '我的個人部落格 (PaperMod 極簡極速風格)'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  showCodeCopyButtons = true
  showFullTextInContent = false
  showReadingTime = true
  showShareButtons = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showToc = true

  [params.profileMode]
    enabled = true
    title = "部落格作者"
    subtitle = "🚀 分享技術隨筆、AI 開發與生活想法"
    imageUrl = "img/author.png"
    imageTitle = "Author Avatar"
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "📝 文章筆記"
      url = "posts"

    [[params.profileMode.buttons]]
      name = "👤 關於本站"
      url = "about"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:user@example.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "📝 所有文章"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "🏷️ 標籤分類"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "👤 關於本站"
    url = "/about/"
    weight = 30
